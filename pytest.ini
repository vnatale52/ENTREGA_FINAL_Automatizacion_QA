[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v -s --strict-markers
markers =
    smoke: Pruebas rápidas de humo para validar flujos críticos
    regression: Pruebas de regresión completa
    login: Pruebas del módulo de autenticación
    catalog: Pruebas del catálogo de productos
    cart: Pruebas de interacciones con el carrito de compras

# Configuración de logs en consola
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(message)s (%(filename)s:%(lineno)s)
log_cli_date_format = %Y-%m-%d %H:%M:%S
