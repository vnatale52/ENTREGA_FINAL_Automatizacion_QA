[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v -s --strict-markers --html=reports/reporte.html --self-contained-html
markers =
    ui: Pruebas de interfaz gráfica de usuario con Selenium WebDriver
    api: Pruebas de integración backend / API REST con Requests
    smoke: Pruebas rápidas de humo para validar flujos críticos
    regression: Pruebas de regresión completa
    e2e: Pruebas de flujo completo de punta a punta (End-to-End)
    negative: Pruebas de escenarios negativos y validación de errores
    login: Pruebas del módulo de autenticación
    catalog: Pruebas del catálogo y filtros de productos
    cart: Pruebas de interacciones con el carrito de compras
    checkout: Pruebas del proceso de pago y confirmación de orden

# Configuración del reporte HTML: muestra todos los detalles desplegados por defecto
render_collapsed = none

# Configuración de logs en consola
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(message)s (%(filename)s:%(lineno)s)
log_cli_date_format = %Y-%m-%d %H:%M:%S
